name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest -q

      - name: Verify migrations apply cleanly
        run: |
          rm -f ci_test.db
          ALERTS_DATABASE_URL="sqlite:///ci_test.db" alembic upgrade head

      - name: Verify migrations roll back cleanly
        # Down then back up again: a downgrade that only ever runs during an
        # incident is a downgrade nobody has tested. SQLite in particular
        # rebuilds the whole table for a dropped column, so a broken batch
        # block fails here rather than at 3am.
        run: |
          ALERTS_DATABASE_URL="sqlite:///ci_test.db" alembic downgrade base
          ALERTS_DATABASE_URL="sqlite:///ci_test.db" alembic upgrade head
