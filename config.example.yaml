# Copy to config.yaml and adjust. Secrets (webhook URLs, SMTP passwords, API
# tokens) are never written here directly: channels reference an environment
# variable name through a *_env field, and anywhere a secret is only part of
# a larger string -- an Authorization header, a webhook URL with a token in
# the path -- a ${VAR} placeholder is resolved from the environment instead.
# See .env.example.

database:
  url: sqlite:///./alerts.db

scheduler:
  default_interval_seconds: 60
  max_concurrent_checks: 20

notifications:
  # How long a channel that already fired for an incident waits before it's
  # notified again (as an escalation) while that incident stays open.
  cooldown_seconds: 900

retention:
  # History older than this is deleted by `alerts prune` (run it from cron).
  # Omit a value, or set it to null, to keep that table forever.
  check_results_days: 30
  resolved_incidents_days: 90
  # Most recent checks per monitor kept regardless of age, so a rarely-checked
  # monitor doesn't end up with an empty dashboard after a quiet stretch.
  min_check_results_per_monitor: 20

dashboard:
  # Read-only web dashboard (`alerts serve`) showing monitor status, uptime,
  # and incident history.
  enabled: true
  host: 127.0.0.1
  port: 8080

maintenance:
  # Planned windows during which a monitor's channels are not notified.
  # Checks still run and results are still recorded -- this suppresses
  # alerting, not monitoring, so you can see afterwards what the change did.
  # Omit `monitors` to cover every monitor.

  # Recurring: `start` is UTC "HH:MM" and the window may run past midnight,
  # in which case it belongs to the day it starts on. Omit `days` for daily.
  - name: nightly-db-patch
    monitors: [main-site]
    days: [sun]
    start: "02:00"
    duration_minutes: 90

  # One-off: an exact span, for a change that isn't on a schedule.
  - name: gateway-migration
    monitors: [api-gateway]
    starts_at: 2026-09-01T01:00:00Z
    ends_at: 2026-09-01T05:00:00Z

monitors:
  - name: main-site
    type: http
    target: https://example.com
    interval_seconds: 30
    timeout_seconds: 5
    expected_status: 200
    failure_threshold: 3
    recovery_threshold: 2
    # A check that succeeds but takes at least this long marks the monitor
    # degraded instead of up. Must stay below timeout_seconds -- anything
    # slower than the timeout is recorded as a failure, not a slow success.
    degraded_latency_ms: 1500
    # HTTP monitors only: the check fails unless the response body contains
    # this substring, even when the status code matches. Useful for health
    # endpoints that answer 200 with a body describing what's broken.
    expected_body_contains: "ok"
    # Free-form grouping labels. They change nothing about how the monitor is
    # checked or alerted -- they exist so `alerts status --tag prod`, the
    # dashboard's tag filter, and `/api/monitors?tag=prod` can narrow a large
    # estate to the part you are responsible for. Folded to lowercase; no
    # commas or spaces.
    tags: [prod, web]
    channels: [ops-slack, ops-email]

  - name: api-gateway
    type: http
    target: https://api.example.com/healthz
    interval_seconds: 15
    failure_threshold: 2
    # HTTP monitors only. Header values may reference environment variables
    # as ${VAR}, so a token never lands in this file; the placeholder is what
    # gets stored, and it's resolved fresh on every check. A variable that
    # isn't set is a startup error naming it, not a mystery 401 later.
    headers:
      Authorization: "Bearer ${API_TOKEN}"
      Accept: application/json
    tags: [prod, api, payments]
    channels: [ops-slack]

  - name: dashboard-itself
    type: http
    # `alerts serve` answers HEAD, so a monitor can watch the dashboard
    # process without pulling a page down every interval. HEAD returns no
    # body, so expected_body_contains can't be used with it.
    target: http://127.0.0.1:8080/healthz
    method: HEAD
    interval_seconds: 60
    tags: [internal]
    channels: [ops-slack]

channels:
  - name: ops-slack
    type: slack
    webhook_url_env: SLACK_WEBHOOK_URL

  - name: ops-email
    type: email
    smtp_host: smtp.example.com
    smtp_port: 587
    from_addr: alerts@example.com
    to_addrs: [oncall@example.com]
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD

  - name: ops-pagerduty
    type: webhook
    url: https://events.example.com/v2/enqueue
    # The URL and the header values both accept ${VAR} placeholders, for
    # receivers that want a token in a header and for the ones that want it
    # in the path instead. Resolved when the notifier is built, so a missing
    # variable stops startup rather than one page.
    headers:
      X-Source: alerts
      X-Api-Key: "${WEBHOOK_API_KEY}"
