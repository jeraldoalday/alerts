# Copy to config.yaml and adjust. Secrets (webhook URLs, SMTP passwords) are
# never written here directly -- channels reference an environment variable
# name and the value is resolved at load time (see .env.example).

database:
  url: sqlite:///./alerts.db

scheduler:
  default_interval_seconds: 60
  max_concurrent_checks: 20

notifications:
  # How long a channel that already fired for an incident waits before it's
  # notified again (as an escalation) while that incident stays open.
  cooldown_seconds: 900

monitors:
  - name: main-site
    type: http
    target: https://example.com
    interval_seconds: 30
    timeout_seconds: 5
    expected_status: 200
    failure_threshold: 3
    recovery_threshold: 2
    channels: [ops-slack, ops-email]

  - name: api-gateway
    type: http
    target: https://api.example.com/healthz
    interval_seconds: 15
    failure_threshold: 2
    channels: [ops-slack]

channels:
  - name: ops-slack
    type: slack
    webhook_url_env: SLACK_WEBHOOK_URL

  - name: ops-email
    type: email
    smtp_host: smtp.example.com
    smtp_port: 587
    from_addr: alerts@example.com
    to_addrs: [oncall@example.com]
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD

  - name: ops-pagerduty
    type: webhook
    url: https://events.example.com/v2/enqueue
    # Unlike webhook_url_env / *_env above, header values are literal --
    # there's no env-var resolution for them yet, so don't put secrets here.
    headers:
      X-Source: alerts
